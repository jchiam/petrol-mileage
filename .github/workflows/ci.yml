name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Neon client initialises at import time; a syntactically valid URL
          # avoids a sync throw. No real DB is ever reached in CI.
          DATABASE_URL: postgresql://ci:ci@localhost/ci

      - name: Dependency audit
        run: npm audit --audit-level=high

  e2e:
    name: E2E tests
    # Deliberately not `needs: ci` — this job installs and builds on its own,
    # so running both in parallel roughly halves the wall time of a green run.
    runs-on: ubuntu-latest
    # Pre-installed Chromium + system deps. The image tag MUST match the
    # installed @playwright/test version — the assert step below fails loudly
    # when a dependency bump moves one without the other.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Assert Playwright image matches @playwright/test
        shell: bash
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "1.65.1" ]; then
            echo "::error::@playwright/test is $installed but the e2e container image is v1.65.1 — bump the image tag in ci.yml"
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          # Neon client initialises at import time; a syntactically valid URL
          # avoids a sync throw. No real DB is used — all server state is mocked.
          DATABASE_URL: postgresql://ci:ci@localhost/ci

      - name: E2E tests
        # Skip `npm run test:e2e` because its pretest hook re-runs `next build`.
        # PROXY_SECRET only needs to match between Playwright's request header
        # and the web server's env — any value works; not the real secret.
        run: npx playwright test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost/ci
          PROXY_SECRET: ci-e2e-secret

      # Traces, screenshots and videos are kept only for failing tests
      # (playwright.config.ts), so there is nothing to upload on a green run.
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

# Deployment is handled by Vercel's GitHub integration (auto-deploys master
# and PR previews) — no deploy job needed here.
